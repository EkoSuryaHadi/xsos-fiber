# Konfigurasi Nginx Reverse Proxy untuk NMS Platform di VPS
# Simpan di /etc/nginx/sites-available/nms.conf (atau via Docker Nginx)

server {
    listen 80;
    server_name nms.your-domain.com; # Ganti dengan domain / IP VPS Anda

    # Redirect semua HTTP ke HTTPS (aktifkan setelah sertifikat SSL dibuat)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    # 1. Frontend Dashboard (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. WebSocket Real-Time Telemetry (/ws/telemetry)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Server-Sent Events (SSE) Stream (/live/stream)
    location /live/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # 4. Backend Direct API (Opsional jika ingin mengekspos endpoint /live atau /business)
    location /proxy-api/ {
        rewrite ^/proxy-api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
