<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IXP Orchestration Portal — Dashboard Visualizations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; background:#0F1A24; color:#14212E; }
  .shell { display:flex; flex-direction:column; height:100vh; }
  .masthead { background:#08131C; padding:14px 22px; display:flex; align-items:center; gap:14px; flex-shrink:0; border-bottom:1px solid rgba(255,255,255,0.08); }
  .masthead img { width:30px; height:30px; display:block; }
  .masthead .titles { display:flex; flex-direction:column; gap:1px; }
  .masthead .brand { color:#fff; font-weight:700; font-size:13px; letter-spacing:0.5px; }
  .masthead .sub { color:#8FA6BA; font-size:11.5px; }
  .live-pill { margin-left:auto; display:flex; align-items:center; gap:16px; }
  .live-badge { display:flex; align-items:center; gap:6px; color:#8BC53E; font-size:11px; font-weight:700; letter-spacing:0.4px; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:#8BC53E; box-shadow:0 0 0 0 rgba(139,197,62,0.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(139,197,62,0.55); } 70% { box-shadow:0 0 0 7px rgba(139,197,62,0); } 100% { box-shadow:0 0 0 0 rgba(139,197,62,0); } }
  .api-tag { color:#5C7488; font-size:10.5px; font-family:"IBM Plex Mono",monospace; }
  .sync-tag { color:#5C7488; font-size:10.5px; font-family:"IBM Plex Mono",monospace; }
  .tabbar { background:#0F1A24; padding:0 22px; display:flex; align-items:center; gap:26px; flex-wrap:wrap; flex-shrink:0; border-bottom:1px solid rgba(255,255,255,0.08); }
  .tabgroup { display:flex; align-items:center; gap:4px; padding:10px 0; }
  .tabgroup-label { color:#5C7488; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-right:8px; }
  .tab { appearance:none; border:none; background:transparent; color:#9FB3C4; font-size:12.5px; font-weight:500; font-family:inherit; padding:8px 13px; border-radius:6px; cursor:pointer; white-space:nowrap; transition:background 0.12s, color 0.12s; }
  .tab:hover { background:rgba(255,255,255,0.06); color:#fff; }
  .tab.active { background:#8BC53E; color:#08360E; font-weight:700; }
  .stage { flex:1; overflow:auto; background:#1B2733; display:flex; justify-content:center; padding:28px 20px; }
  .frame-wrap { position:relative; background:#EEF1F5; box-shadow:0 12px 36px rgba(0,0,0,0.35); border-radius:4px; overflow:hidden; flex-shrink:0; }
  .frame-wrap iframe { border:none; display:block; transform-origin: top left; }
  .hint { position:fixed; bottom:14px; right:18px; color:#5C7488; font-size:10.5px; font-family:"IBM Plex Mono", monospace; background:rgba(0,0,0,0.25); padding:5px 10px; border-radius:5px; }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#8B98A5; font-size:12px; background:#EEF1F5; }

  /* API console */
  #apiPanel { flex:1; overflow:hidden; display:flex; background:#0F1A24; padding:20px 22px; gap:18px; }
  #apiPanel[hidden] { display:none; }
  .api-col { background:#131F2B; border:1px solid rgba(255,255,255,0.08); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; }
  .api-col-head { padding:13px 16px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .api-col-title { color:#E7EEF4; font-size:12.5px; font-weight:700; letter-spacing:0.2px; }
  .api-col-sub { color:#5C7488; font-size:10.5px; font-family:"IBM Plex Mono",monospace; }
  #trafficCol { flex:1.1; min-width:0; }
  #explorerCol { flex:1; min-width:0; }
  #trafficLog { flex:1; overflow-y:auto; padding:6px 0; font-family:"IBM Plex Mono",monospace; font-size:11.5px; }
  .tr-row { display:flex; align-items:center; gap:10px; padding:7px 16px; border-bottom:1px solid rgba(255,255,255,0.04); color:#C7D4DD; }
  .tr-method { width:52px; flex-shrink:0; font-weight:700; border:1px solid; border-radius:4px; padding:1px 5px; text-align:center; font-size:10.5px; }
  .tr-url { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#9FB3C4; }
  .tr-status { width:32px; flex-shrink:0; font-weight:700; text-align:right; }
  .tr-lat { width:52px; flex-shrink:0; color:#5C7488; text-align:right; }
  .tr-time { width:56px; flex-shrink:0; color:#41505E; text-align:right; }
  .api-explorer-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .api-field-label { color:#5C7488; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px; }
  #apiPresetSelect { width:100%; background:#0F1A24; color:#E7EEF4; border:1px solid rgba(255,255,255,0.14); border-radius:6px; padding:9px 10px; font-family:inherit; font-size:12.5px; }
  .api-code-box { background:#0A121A; border:1px solid rgba(255,255,255,0.08); border-radius:7px; padding:11px 13px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:#9BE38B; white-space:pre-wrap; word-break:break-word; max-height:220px; overflow-y:auto; }
  #apiResponsePreview { color:#7DC4F0; min-height:60px; }
  .api-send-btn { appearance:none; border:none; background:#8BC53E; color:#08360E; font-weight:700; font-size:12.5px; padding:10px 16px; border-radius:7px; cursor:pointer; align-self:flex-start; }
  .api-send-btn:disabled { opacity:0.6; cursor:default; }
  .token-chip { font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:#8BC53E; background:rgba(139,197,62,0.1); padding:4px 9px; border-radius:5px; }
</style>
</head>

  function gradientStops(parts, colors) {
    var total = parts.reduce(function (a, b) { return a + b; }, 0) || 1;
    var acc = 0, stops = [];
    for (var i = 0; i < parts.length; i++) {
      var from = (acc / total) * 100;
      acc += parts[i];
      var to = (acc / total) * 100;
      stops.push(colors[i] + " " + from.toFixed(2) + "% " + to.toFixed(2) + "%");
    }
    return "conic-gradient(" + stops.join(", ") + ")";
  }

  function stepperHTML(stage) {
    var labels = ["Validating", "Configuring Hardware", "Activating", "Active"];

      if (i < stage || stage === 3) { cls = "step-dot done"; content = "✓"; }
      else if (i === stage) { cls = "step-dot cur"; content = "●"; }
      else { cls = "step-dot pending"; content = String(i + 1); }
      out += '<div class="' + cls + '">' + content + "</div>";
      if (i < 3) {
        var lineDone = i < stage || stage === 3;
        out += '<div class="step-line' + (lineDone ? " done" : "") + '"></div>';

    return '<div class="stepper">' + out + "</div><div class=\"step-label\">" + labels[Math.min(stage, 3)] + "</div>";

      var avgSec = clamp(192 + rndInt(-8, 8), 150, 240);
      setText(doc, "bod-stat-avgtime", Math.floor(avgSec / 60) + "m " + (avgSec % 60) + "s");
      setText(doc, "bod-stat-auto", clamp(Math.round(94 + rnd(-1, 1)), 88, 99) + "%");
    },
    analytics: function (doc) {
      setText(doc, "an-latency", state.latencyMs.toFixed(1));
      setText(doc, "an-jitter", state.jitterMs.toFixed(2));
      setText(doc, "an-ploss", state.packetLossPct.toFixed(2));
      setText(doc, "an-netconf", Math.round(state.netconfMs) + " ms");
      setText(doc, "an-restapi", Math.round(state.restApiMs) + " ms");
      setText(doc, "an-license", state.licenseUsed + "/" + state.licenseTotal);
    },
    faults: function (doc) {
      setText(doc, "fault-event-count", fmtInt(state.faultEventCount));
      setHTML(doc, "fault-rows", state.faultEvents.slice(0, 8).map(faultRowHTML).join(""));
      setText(doc, "ticket-open-count", Object.keys(state.tickets).filter(function (k) { return state.tickets[k] !== "Resolved"; }).length);
      var list = doc.getElementById("ticket-list");
      if (list) {
        Object.keys(state.tickets).forEach(function (id) {
          var node = list.querySelector('[data-ticket="' + id + '"] [data-status]');
          if (!node) return;
          var status = state.tickets[id];
          node.textContent = status;
          node.className = "badge " + (status === "Scheduled" ? "critical" : status === "In Progress" ? "warning" : "good");
        });
      }
    }
  };

  /* ---------- clock ticking (every second, all open docs) ---------- */
  var boundDocs = {}; // viewKey -> Document
  function tickClocks() {
    var d = new Date();
    var parts = fmtClockParts(d);
    Object.keys(boundDocs).forEach(function (k) {
      var doc = boundDocs[k];
      if (!doc) return;
      var el = doc.getElementById("clock");
      if (!el) return;
      el.textContent = el.classList.contains("mono") ? parts.full : parts.short;
    });
  }
  setInterval(tickClocks, 1000);

  /* ---------- simulation tick (every ~2.5s): mutate state + occasionally poll API ---------- */
  var tickCount = 0;
  function simulate() {
    tickCount++;
    state.throughputTbps = clamp(state.throughputTbps + rnd(-0.02, 0.02), 1.55, 1.98);
    state.ports.connected = clamp(Math.round(state.ports.connected + rnd(-2, 2)), 690, 800);
    state.activeSessions = clamp(Math.round(state.activeSessions + rnd(-1.2, 1.2)), 195, 232);
    state.availabilityPct = clamp(state.availabilityPct + rnd(-0.0006, 0.0004), 99.985, 99.999);
    state.latencyMs = clamp(state.latencyMs + rnd(-0.05, 0.05), 0.7, 1.9);
    state.jitterMs = clamp(state.jitterMs + rnd(-0.006, 0.006), 0.04, 0.18);
    state.packetLossPct = clamp(state.packetLossPct + rnd(-0.002, 0.002), 0, 0.03);
    state.netconfMs = clamp(state.netconfMs + rnd(-6, 6), 85, 165);
    state.restApiMs = clamp(state.restApiMs + rnd(-8, 8), 160, 260);
    state.licenseUsed = clamp(Math.round(state.licenseUsed + rnd(-1, 1)), 660, 720);

    state.alarms.forEach(function (a) { a.age += 2.5 / 60; });

    if (Math.random() < 0.16) {
      state.alarms.unshift(Object.assign({ age: 0 }, pick(alarmPool)));
      if (state.alarms.length > 6) state.alarms.length = 6;
    }

    if (Math.random() < 0.22) {
      var bump = state.bodRequests.find(function (r) { return r.stage < 3; });
      if (bump) bump.stage++;
    }
    if (Math.random() < 0.10) {
      var route = pick(routePool);
      state.bodRequests.unshift({
        id: "BOD-" + (state.bodSeq++), route: route.route, capacity: route.cap, sla: route.sla,
        stage: 0, time: fmtClockParts(new Date()).short.slice(0, 5)
      });
      state.bodMonthCount++;
      if (state.bodRequests.length > 5) state.bodRequests.length = 5;
      NMS.connect({
        source_panel_name: "XSOS-576D-1", source_port_no: [rndInt(1, 288)],
        target_panel_name: "XSOS-576D-2", target_port_no: [rndInt(1, 288)], route: 0
      });
    }

    if (Math.random() < 0.20) {
      var ev = pick(eventPool);
      var isCritical = ev.sev === "critical";
      state.faultEvents.unshift({
        sev: ev.sev, ts: fmtClockParts(new Date()).short, source: ev.source, category: ev.category,
        message: ev.message, status: isCritical ? "Open" : "Ack"
      });
      if (state.faultEvents.length > 8) state.faultEvents.length = 8;
      state.faultEventCount++;
    }

    if (Math.random() < 0.10) {
      var openTickets = Object.keys(state.tickets).filter(function (k) { return state.tickets[k] !== "Resolved"; });
      if (openTickets.length) {
        var tid = pick(openTickets);
        state.tickets[tid] = state.tickets[tid] === "Scheduled" ? "In Progress" : "Resolved";
      }
    }

    var pollSchedule = [
      function () { return NMS.getSystemStatus(); },
      function () { return NMS.getPortsSummary(); },
      function () { return NMS.getQueues(); },
      function () { return NMS.getConnections(); },
      function () { return NMS.getPorts({ query: "limit=10&offset=0" }); }
    ];
    pollSchedule[tickCount % pollSchedule.length]();
    if (tickCount % 9 === 0) NMS.refreshToken();

    Object.keys(boundDocs).forEach(function (k) {
      if (boundDocs[k] && renderers[k]) renderers[k](boundDocs[k]);
    });
  }
  setInterval(simulate, 2500);

  window.NMSEngine = {
    bindView: function (key, doc) {
      boundDocs[key] = doc;
      tickClocks();
      if (renderers[key]) renderers[key](doc);
    },
    unbindView: function (key) { delete boundDocs[key]; },
    state: state
  };

  /* kick off with a login so the console has a token from the start */
  NMS.login("Admin", "Admin");
})();

</script>
<script>
/* API Console: live traffic feed + interactive "try it" explorer,
   wired to the NMS mock engine (window.NMS / window.NMSActivity). */
(function () {
  "use strict";

  var PRESETS = [
    { id: "login", label: "1.1 Login", method: "POST", path: "/api/v2/authentication/login", auth: false,
      body: { username: "Admin", password: "Admin" } },
    { id: "refresh", label: "1.2 Refresh Token", method: "POST", path: "/api/v2/authentication/token/refresh", auth: true,
      body: { refresh_token: "{refresh_token}" } },
    { id: "logout", label: "1.3 Logout", method: "DELETE", path: "/api/v2/authentication/logout", auth: true, body: null },
    { id: "connect", label: "2.1 Create Connection", method: "POST", path: "/api/v2/connectivity/connect", auth: true,
      body: { source_panel_name: "XSOS-576D-1", source_port_no: [1], target_panel_name: "XSOS-576D-2", target_port_no: [145], route: 0 } },
    { id: "disconnect", label: "2.2 Create Disconnection", method: "POST", path: "/api/v2/connectivity/disconnect", auth: true,
      body: { panel_name: "XSOS-576D-1", port_no: 1 } },
    { id: "disconnectById", label: "2.3 Create Disconnection by ID", method: "POST", path: "/api/v2/connectivity/connections/1/disconnect", auth: true, body: null },
    { id: "queues", label: "3.1 View Remaining Tasks", method: "GET", path: "/api/v2/connectivity/queues", auth: true, body: null },
    { id: "connections", label: "3.2 View Current Connections", method: "GET", path: "/api/v2/connectivity/connections", auth: true, body: null },
    { id: "ports", label: "4.1 View Port Information", method: "GET", path: "/api/v2/ports?limit=10&offset=0&ordering=desc", auth: true, body: null },
    { id: "portsSummary", label: "4.2 View Port Summary", method: "GET", path: "/api/v2/ports/summary", auth: true, body: null },
    { id: "systemStatus", label: "5.1 View System Information", method: "GET", path: "/api/v2/system/status", auth: true, body: null },
    { id: "inventory", label: "5.2 View System Inventory", method: "GET", path: "/api/v2/inventory", auth: true, body: null }
  ];

  var EXEC = {
    login: function () { return NMS.login("Admin", "Admin"); },
    refresh: function () { return NMS.refreshToken(); },
    logout: function () { return NMS.logout(); },
    connect: function () { return NMS.connect({ source_panel_name: "XSOS-576D-1", source_port_no: [1], target_panel_name: "XSOS-576D-2", target_port_no: [145], route: 0 }); },
    disconnect: function () { return NMS.disconnect("XSOS-576D-1", 1); },
    disconnectById: function () { return NMS.disconnectById(1); },
    queues: function () { return NMS.getQueues(); },
    connections: function () { return NMS.getConnections(); },
    ports: function () { return NMS.getPorts({ query: "limit=10&offset=0&ordering=desc" }); },
    portsSummary: function () { return NMS.getPortsSummary(); },
    systemStatus: function () { return NMS.getSystemStatus(); },
    inventory: function () { return NMS.getInventory(); }
  };

  function byId(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function methodColor(m) { return m === "GET" ? "#4d9fe0" : m === "DELETE" ? "#e0645b" : "#8BC53E"; }
  function pretty(obj) { return JSON.stringify(obj, null, 2); }
  function timeAgo(ts) {
    var s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
    return s < 1 ? "now" : s + "s ago";
  }

  function trafficRowHTML(e) {
    var statusColor = e.status < 300 ? "#0ca30c" : "#d03b3b";
    return '<div class="tr-row">' +
      '<span class="tr-method" style="color:' + methodColor(e.method) + ';border-color:' + methodColor(e.method) + '55;">' + e.method + '</span>' +
      '<span class="tr-url">' + esc(e.url.replace(/^https?:\/\/[^/]+/, "")) + '</span>' +
      '<span class="tr-status" style="color:' + statusColor + ';">' + e.status + '</span>' +
      '<span class="tr-lat">' + e.latency + 'ms</span>' +
      '<span class="tr-time">' + timeAgo(e.ts) + '</span>' +
      '</div>';
  }

  var trafficEl, presetSel, reqPreviewEl, resPreviewEl, sendBtn, tokenEl;

  function renderPreset() {
    var p = PRESETS.filter(function (x) { return x.id === presetSel.value; })[0];
    var lines = [p.method + " " + NMS.baseUrl + p.path];
    if (p.auth) lines.push("Authorization: Bearer " + (NMSState.accessToken ? NMSState.accessToken.slice(0, 24) + "…" : "{access_token}"));
    lines.push("Content-Type: application/json");
    if (p.body) { lines.push(""); lines.push(pretty(p.body)); }
    reqPreviewEl.textContent = lines.join("\n");
  }

  function send() {
    var p = PRESETS.filter(function (x) { return x.id === presetSel.value; })[0];
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    resPreviewEl.textContent = "";
    EXEC[p.id]().then(function (entry) {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
      resPreviewEl.textContent = "HTTP " + entry.status + " · " + entry.latency + "ms\n\n" + pretty(entry.resBody);
      renderPreset();
    });
  }

  function refreshTraffic() {
    trafficEl.innerHTML = NMSActivity.log.slice(0, 40).map(trafficRowHTML).join("");
  }

  function tickAges() {
    if (byId("apiPanel") && byId("apiPanel").hidden) return;
    var rows = trafficEl.querySelectorAll(".tr-row .tr-time");
    var log = NMSActivity.log;
    for (var i = 0; i < rows.length && i < log.length; i++) rows[i].textContent = timeAgo(log[i].ts);
  }

  function initApiConsole() {
    trafficEl = byId("trafficLog");
    presetSel = byId("apiPresetSelect");
    reqPreviewEl = byId("apiRequestPreview");
    resPreviewEl = byId("apiResponsePreview");
    sendBtn = byId("apiSendBtn");
    tokenEl = byId("apiTokenChip");

    PRESETS.forEach(function (p) {
      var opt = document.createElement("option");
      opt.value = p.id; opt.textContent = p.label;
      presetSel.appendChild(opt);
    });
    presetSel.addEventListener("change", renderPreset);
    sendBtn.addEventListener("click", send);
    renderPreset();
    refreshTraffic();

    NMSActivity.onActivity(function () {
      refreshTraffic();
      if (tokenEl && NMSState.accessToken) tokenEl.textContent = "Bearer " + NMSState.accessToken.slice(0, 18) + "…";
    });
    setInterval(tickAges, 1000);
  }

  window.initApiConsole = initApiConsole;
})();

</script>

const frame = document.getElementById('viewFrame');
const wrap = document.getElementById('frameWrap');
const stage = document.getElementById('stage');
const loading = document.getElementById('loading');
const hint = document.getElementById('hint');
const apiPanel = document.getElementById('apiPanel');
let current = 'main';

function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function fitScale(nativeW, nativeH, fitHeightToo) {
  const availW = stage.clientWidth - 40;
  const availH = stage.clientHeight - 40;
  const scale = fitHeightToo
    ? Math.min(1, availW / nativeW, availH / nativeH)
    : Math.min(1, availW / nativeW);
  return Math.max(scale, 0.28);
}

function render() {
  const v = VIEWS[current];
  const fitHeightToo = v.h <= 1100;
  const scale = fitScale(1440, v.h, fitHeightToo);
  frame.width = 1440;
  frame.height = v.h;
  frame.style.transform = `scale(${scale})`;
  wrap.style.width = (1440 * scale) + 'px';
  wrap.style.height = (v.h * scale) + 'px';
  stage.style.alignItems = fitHeightToo ? 'center' : 'flex-start';
  hint.textContent = v.label + '  ·  ' + Math.round(scale * 100) + '% scale  ·  1440×' + v.h + ' native';
}

function setActiveTab(key) {
  document.querySelectorAll('.tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === key);
  });
}

function selectView(key) {
  if (key === 'api') {
    current = 'api';
    setActiveTab('api');
    stage.style.display = 'none';
    apiPanel.hidden = false;
    hint.textContent = 'API Console · nms2-sandbox.xenoptics.co';
    return;
  }
  if (!VIEWS[key]) return;
  if (window.NMSEngine) NMSEngine.unbindView(current);
  current = key;
  setActiveTab(key);
  stage.style.display = 'flex';
  apiPanel.hidden = true;
  loading.style.display = 'flex';
  const html = b64ToUtf8(VIEWS[key].b64);
  frame.srcdoc = html;
  render();
}

frame.addEventListener('load', () => {
  loading.style.display = 'none';
  const v = VIEWS[current];
  if (v && v.bindable && window.NMSEngine && frame.contentDocument) {
    NMSEngine.bindView(current, frame.contentDocument);
  } else if (window.NMSEngine && frame.contentDocument) {
    NMSEngine.bindView('_clockonly_' + current, frame.contentDocument);
  }
});
window.addEventListener('resize', render);

window.addEventListener('DOMContentLoaded', () => {
  if (window.initApiConsole) initApiConsole();
});

let lastSyncAt = Date.now();
if (window.NMSActivity) {
  NMSActivity.onActivity(() => { lastSyncAt = Date.now(); });
}
setInterval(() => {
  const el = document.getElementById('syncAgo');
  if (!el) return;
  const s = Math.round((Date.now() - lastSyncAt) / 1000);
  el.textContent = s < 1 ? 'synced now' : 'synced ' + s + 's ago';
}, 1000);

selectView('main');
</script>
